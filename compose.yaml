name: dnf-leader-tool

services:
  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnf_leader}
      POSTGRES_USER: ${POSTGRES_USER:-dnf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnf-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://dnf:dnf-local-only@db:5432/dnf_leader}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SOLVER_TIME_LIMIT_SECONDS: ${SOLVER_TIME_LIMIT_SECONDS:-10}
      SOLVER_RANDOM_SEED: ${SOLVER_RANDOM_SEED:-42}
      IMPORT_DEFAULT_TREASURE_DAMAGE: ${IMPORT_DEFAULT_TREASURE_DAMAGE:-false}
      IMPORT_DEFAULT_FIXED_LEAD_TEAM_BUFFER: ${IMPORT_DEFAULT_FIXED_LEAD_TEAM_BUFFER:-false}
      IMPORT_DEFAULT_GROUP_HUNT: ${IMPORT_DEFAULT_GROUP_HUNT:-false}
      IMPORT_DEFAULT_RAID_PARTICIPANT: ${IMPORT_DEFAULT_RAID_PARTICIPANT:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_SOURCE_ATTEMPTS: ${LOGIN_RATE_LIMIT_SOURCE_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-900}
      EDIT_LOCK_LEASE_SECONDS: ${EDIT_LOCK_LEASE_SECONDS:-90}
      EDIT_LOCK_HEARTBEAT_SECONDS: ${EDIT_LOCK_HEARTBEAT_SECONDS:-30}
      NATURAL_LANGUAGE_RULES_ENABLED: ${NATURAL_LANGUAGE_RULES_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      RULE_PROMPT_VERSION: ${RULE_PROMPT_VERSION:-schedule-rules-v2}
      NATURAL_LANGUAGE_RULE_MAX_CHARS: ${NATURAL_LANGUAGE_RULE_MAX_CHARS:-2000}
      NATURAL_LANGUAGE_RULE_RATE_LIMIT_REQUESTS: ${NATURAL_LANGUAGE_RULE_RATE_LIMIT_REQUESTS:-10}
      NATURAL_LANGUAGE_RULE_RATE_LIMIT_WINDOW_SECONDS: ${NATURAL_LANGUAGE_RULE_RATE_LIMIT_WINDOW_SECONDS:-60}
      BOOTSTRAP_OWNER_USERNAME: ${BOOTSTRAP_OWNER_USERNAME:-admin}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-change-me-now}
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && .venv/bin/python -m app.cli seed && .venv/bin/python -m app.cli init-owner && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        VITE_SHOW_DEV_LOGIN: ${VITE_SHOW_DEV_LOGIN:-true}
        VITE_DEV_LOGIN_ACCOUNT: ${BOOTSTRAP_OWNER_USERNAME:-admin}
        VITE_DEV_LOGIN_CODE: ${BOOTSTRAP_OWNER_PASSWORD:-change-me-now}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
