[project]
name = "dnf-leader-backend"
version = "0.1.0"
description = "DNF 团长排表工具后端"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.128,<1",
  "openpyxl>=3.1,<4",
  "ortools>=9.15,<10",
  "pillow>=11,<13",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.14,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not performance'"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "performance: explicit solver and export performance acceptance",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
